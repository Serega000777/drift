name: core-tests
# Engine-free tests (no Unity license needed) + secret scan on every push / PR.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for credentials
        run: bash tools/security/scan-secrets.sh
  test:
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build (warnings as errors) and test DriftCareer.Core
        run: dotnet test tools/CoreTests --logger "console;verbosity=normal"
